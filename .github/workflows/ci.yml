name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PROD_MANIFEST_URL: https://aglivin.github.io/vault-lakehouse-migration/manifest.json

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      warehouse-secrets: ${{ steps.secrets.outputs.present }}
    env:
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/dummy.p8
      SNOWFLAKE_ROLE: dummy
      SNOWFLAKE_WAREHOUSE: dummy
      SNOWFLAKE_DATABASE: dummy
    steps:
      - id: secrets
        run: echo "present=${{ secrets.SNOWFLAKE_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run dbt deps --project-dir dbt --profiles-dir dbt --target snowflake_dev
      - run: uv run sqlfluff lint dbt/models
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt --target snowflake_dev
      - run: uv run pytest -q

  dbt-slim:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.warehouse-secrets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: dbt-slim-${{ github.event.pull_request.number }}
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      DBT_TARGET: snowflake_ci
      DBT_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run dbt deps
      - name: Wait for a running prod deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 5 \
              --json status --jq '[.[] | select(.status != "completed")] | length'
          }
          while [ "$(running)" != 0 ]; do
            echo "prod deploy in progress, waiting before deferring to prod"
            sleep 30
          done
      - name: Fetch prod manifest
        id: state
        run: |
          mkdir -p "$RUNNER_TEMP/prod-manifest"
          if curl -fsSL "$PROD_MANIFEST_URL" -o "$RUNNER_TEMP/prod-manifest/manifest.json"; then
            echo "mode=slim" >> "$GITHUB_OUTPUT"
            echo "prod manifest found, building state:modified+ with defer"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "no prod manifest, building the whole project"
          fi
      - name: Build one load date at a time
        env:
          MODE: ${{ steps.state.outputs.mode }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          set -euo pipefail
          selection=()
          if [ "$MODE" = slim ]; then
            selection=(--select "state:modified+" "1+state:modified+,config.materialized:view" --defer --state "$RUNNER_TEMP/prod-manifest")
          fi
          scripts/build_by_load_date.sh "${selection[@]}"
      - name: Drop PR schemas
        if: always()
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: uv run dbt run-operation drop_pr_schemas
