models:
  - name: bv_customer_master
    columns:
      - name: customer_hk
        data_tests: [unique, not_null]
      - name: master_customer_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk
  - name: bv_contract_master
    columns:
      - name: contract_hk
        data_tests: [unique, not_null]
      - name: master_contract_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_contract')
                field: contract_hk
  - name: bv_invoice_master
    columns:
      - name: invoice_hk
        data_tests: [unique, not_null]
      - name: master_invoice_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_invoice')
                field: invoice_hk
  - name: bv_tariff_master
    columns:
      - name: tariff_hk
        data_tests: [unique, not_null]
      - name: master_tariff_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_tariff')
                field: tariff_hk
  - name: bv_meter_master
    columns:
      - name: meter_hk
        data_tests: [unique, not_null]
      - name: master_meter_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_meter')
                field: meter_hk
  - name: pit_customer
    description: Point in time. One row per master customer and as-of date, with the latest v1 and v2 satellite load date at or before that date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_hk, as_of_date]
    columns:
      - name: customer_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk
      - name: as_of_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('as_of_dates')
                field: as_of_date
  - name: bridge_customer_contract
    description: Bridge. One row per master customer, master contract and as-of date, from the first load of their link. A contract is left out for the as-of dates on which its latest sts_contract status is D (deleted at the source). eff_sat_customer_contract is not used, because it reads v1 contracts only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_hk, contract_hk, as_of_date]
    columns:
      - name: customer_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk
      - name: contract_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_contract')
                field: contract_hk
